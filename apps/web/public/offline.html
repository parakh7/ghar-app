<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C2410C" />
    <title>You're offline — Ghar</title>
    <style>
      :root { --paper: #FAF7F2; --surface: #FFFFFF; --ink: #2D2A26; --ink-2: #5C554C; --line: #E8E1D6; --accent-700: #C8452F; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 32px; max-width: 360px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: var(--ink-2); }
      button { min-height: 48px; padding: 0 24px; border-radius: 999px; border: none; background: var(--accent-700); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Check your connection and try again.</p>
      <button id="retry" type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
